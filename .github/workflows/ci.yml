# Pull request / push validation. Runs untrusted PR code without secrets and
# with read-only permissions only.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: GDScript format & lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/requirements-dev.txt
      - run: ./tools/lint.sh

  godot:
    name: Import, compile, tests, smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cache Godot download
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/godot-dl
          key: godot-${{ hashFiles('tools/godot-version.txt', 'tools/ci/install_godot.sh') }}
      - name: Install pinned Godot (SHA-512 verified)
        run: ./tools/ci/install_godot.sh
      - name: Import project and compile every script
        run: timeout 600 ./tools/check.sh
      - name: Unit and integration tests
        run: timeout 900 godot --headless --path game -- --test
      - name: Startup smoke test (build map, spawn enemy, 300 frames)
        run: timeout 300 godot --headless --path game -- --smoke
      - name: Clean up stray Godot processes
        if: always()
        run: pkill -x godot || true

  lobby:
    name: Lobby service tests & typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/lobby
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/lobby/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  relay:
    name: Relay (Cloudflare Worker) tests & typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/relay
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  online-e2e:
    name: Online end-to-end (relay + 2 Godot clients)
    needs: [godot, relay]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cache Godot download
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/godot-dl
          key: godot-${{ hashFiles('tools/godot-version.txt', 'tools/ci/install_godot.sh') }}
      - name: Install pinned Godot (SHA-512 verified)
        run: ./tools/ci/install_godot.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/relay/package-lock.json
      - name: Install relay dependencies
        working-directory: services/relay
        run: npm ci
      - name: Import project
        run: timeout 600 godot --headless --path game --import
      - name: Start the relay locally (wrangler dev, no Cloudflare account needed)
        working-directory: services/relay
        run: |
          nohup npx wrangler dev --port 8787 --ip 127.0.0.1 > /tmp/relay.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/v1/health && exit 0; sleep 2; done
          cat /tmp/relay.log; exit 1
      - name: Relay protocol checks
        working-directory: services/relay
        run: RELAY_URL=http://127.0.0.1:8787 timeout 120 node scripts/check-relay.ts
      - name: Create, join, play, reconnect, finish and host departure across processes
        working-directory: services/relay
        run: GODOT_BIN="$(command -v godot)" RELAY_URL=http://127.0.0.1:8787 timeout 900 npm run e2e
      - name: Clean up
        if: always()
        run: pkill -x godot || true; pkill -f "wrangler dev" || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (SHA-256 verified)
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git --redact --no-banner --verbose .

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4.7.1
        with:
          fail-on-severity: high
